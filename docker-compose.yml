services:
  dsh:
    build: .
    image: deepseek-harness:0.2.1-rc.2-r1
    container_name: dsh
    restart: unless-stopped
    ports:
      # Публикуем ТОЛЬКО на loopback. Порты соответствуют runzhliu:
      # 3080 — Web UI, 6080 — noVNC (если нужен).
      - "127.0.0.1:3080:3079"
      - "127.0.0.1:6080:6080"
    environment:
      # Токен доступа к Web UI генерируется автоматически и печатается в логах.
      # Смотрите `docker compose logs dsh | grep 'dsh web:'`
      - TZ=Europe/Moscow
    volumes:
      # Постоянный том для всех данных DSH: профили, плагины, сессии, настройки.
      - dsh-home:/home/node/.dsh
      # Рабочая директория на хосте (опционально, но удобно для доступа к файлам)
      - ./workspace:/workspace
      - bridge-session:/app/session:rw  # ← только чтение
    networks:
      - dsh-net

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: bridge
    profiles: ["bridge"]          # запускается с --profile bridge
    ports:
      - "127.0.0.1:8000:8000"     # только для отладки
    volumes:
      - bridge-session:/app/session
      - ./bridge/.env:/app/.env:ro
      - dsh-home:/dsh-home
    environment:
      - TZ=Europe/Moscow
      - DSH_HOME=/dsh-home
    networks:
      - dsh-net
    restart: unless-stopped

  # dsh-bridge-auth:
  #   build:
  #     context: ./bridge
  #     dockerfile: Dockerfile.auth
  #   container_name: dsh-bridge-auth
  #   profiles: ["auth"]            # запускается только когда нужен вход
  #   ports:
  #     - "127.0.0.1:6081:6080"     # VNC
  #   volumes:
  #     - bridge-session:/app/session
  #     - ./bridge/.env:/app/.env:ro
  #   environment:
  #     - DISPLAY=:99
  #     - RESOLUTION=1280x800x24
  #     - VNC_PASSWORD=password
  #     - PYTHONUNBUFFERED=1  # <-- логи в реальном времени
  #   networks:
  #     - dsh-net
  #   tty: false
  #   stdin_open: false
  #   # После завершения скрипта контейнер просто останавливается (exit 0)

networks:
  dsh-net:
    driver: bridge

volumes:
  dsh-home:
  bridge-session: