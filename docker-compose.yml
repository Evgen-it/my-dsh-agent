services:
  deepseek-harness:
    build: .
    image: deepseek-harness:0.2.1-rc.2-r1
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      # Публикуем ТОЛЬКО на loopback. Порты соответствуют runzhliu:
      # 3080 — Web UI, 6080 — noVNC (если нужен).
      - "127.0.0.1:3080:3079"
      - "127.0.0.1:6080:6080"
    environment:
      # Токен доступа к Web UI генерируется автоматически и печатается в логах.
      # Смотрите `docker compose logs dsh | grep 'dsh web:'`
      - TZ=Europe/Moscow
    volumes:
      # Постоянный том для всех данных DSH: профили, плагины, сессии, настройки.
      - dsh-home:/home/node/.dsh
      # Рабочая директория на хосте (опционально, но удобно для доступа к файлам)
      - ./workspace:/workspace

volumes:
  dsh-home: